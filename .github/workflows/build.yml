name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install buildozer
        run: pip install --upgrade buildozer cython==0.29.36 virtualenv
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show the real error
        if: failure()
        shell: bash
        run: |
          echo "=============== ERROR LINES ==============="
          grep -n -i -E "error:|fatal|Traceback|No such file|not found|failed|Exception|Killed|No space" build.log | grep -v -i "Wno-\|Werror=\|deprecated" | tail -40
          echo "=============== LAST 60 LINES ==============="
          tail -60 build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3edda-apk
          path: |
            bin/*.apk
            build.log
